receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
processors:
  batch: {}
  # Defensa adicional: elimina atributos que nunca deberían salir del servicio.
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.x-api-key
        action: delete
exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic
service:
  pipelines:
    metrics:
      receivers: [ otlp ]
      processors: [ attributes/redact, batch ]
      exporters: [ prometheus ]
    traces:
      receivers: [ otlp ]
      processors: [ attributes/redact, batch ]
      exporters: [ debug ]
