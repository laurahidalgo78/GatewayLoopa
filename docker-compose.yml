# Entorno de DESARROLLO. Nunca usar estas credenciales ni este archivo en producción.
#   docker compose up --build                         -> API + SQL Server
#   docker compose --profile observability up         -> + OpenTelemetry Collector + Prometheus
#   docker compose --profile vault up                 -> + Vault en modo dev (para probar Secrets:Provider=Vault)
name: apigatewaypay

services:
  api:
    build: .
    image: apigatewaypay:dev
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Persistence__Provider: SqlServer
      Persistence__ConnectionString: "Server=sqlserver,1433;Database=ApiGatewayPay;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Persistence__AutoCreateSchema: "true"
      Bank__Mock__Webhooks__TargetUrl: "http://localhost:8080/v1/webhooks/bank/mock"
      Telemetry__OtlpEndpoint: "http://otel-collector:4317"
    volumes:
      # La configuración de desarrollo (usuarios y secretos sandbox) no está en la imagen: se monta solo aquí.
      - ./src/ApiGatewayPay.Api/appsettings.Development.json:/app/appsettings.Development.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    read_only: true
    tmpfs: [ /tmp ]
    security_opt: [ "no-new-privileges:true" ]
    cap_drop: [ ALL ]

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  otel-collector:
    profiles: [ observability ]
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: [ "--config=/etc/otel/config.yaml" ]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"

  prometheus:
    profiles: [ observability ]
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  vault:
    profiles: [ vault ]
    image: hashicorp/vault:1.17
    cap_add: [ IPC_LOCK ]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "127.0.0.1:8200:8200"

volumes:
  sqldata:
